[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aethernet-core"
version = "3.0.0"
description = "Full HTTP and WebSocket traffic over any message-based transport — strings or bytes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE*"]
requires-python = ">=3.12"
authors = [
    { name = "Walter Kerrigan", email = "esolment@gmail.com" },
]
dependencies = [
    "basex-python==0.1.0",
    "pycryptodome>=3.23.0,<4",
    "msgpack>=1.2.1,<2",
    "httpx>=0.28.1,<0.29",
    "websockets>=16.0,<16.1",
    "pillow>=12.3,<13",
    "mss>=10.2,<11",
    "screeninfo>=0.8.1,<1",
    "pynput>=1.8.2,<2",
    "copykitten>=2.0.0,<3",
]

[project.optional-dependencies]
tests = [
    "pytest>=9.0,<10",
    "pytest-mock>=3.15,<4",
    "pytest-asyncio>=1.3,<2",
    "hypothesis>=6.152,<7",
]

lint = [
    "ruff>=0.16,<1",
    "mypy>=2.3,<3",
]

build = [
    "twine>=7,<8",
    "build>=1.5,<2",
]

dev = [
    "aethernet-core[tests,lint,build]",
]

[project.urls]
Homepage = "https://github.com/solment-slet/aethernet"
Repository = "https://github.com/solment-slet/aethernet"

[project.scripts]
athnet = "aethernet.cli:run"

[tool.ruff]
extend-exclude = [
    "tests/",
    "aethernet_link.py",
    "README.md",
]

[tool.ruff.lint]
ignore = ["BLE001"]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["aethernet"]
combine-as-imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.mypy]
exclude = ["tests/"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/aethernet"]
